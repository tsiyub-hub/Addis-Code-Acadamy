<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply</title>
</head>
<body>
    <header>
    <h1>Addis Code Academy</h1>
    <p>Admissions Application</p>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="apply.html">Apply</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Apply for the Next Cohort</h2>
      <p>Complete the form below to express interest in joining Addis Code Academy.</p>

      <form  method="post">
        <fieldset>
          <legend>Applicant Information</legend>

          <p>
            <label for="full-name">Full Name:</label><br>
            <input type="text" id="full-name" name="full_name" required>
          </p>

          <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
          </p>

          <p>
            <label for="track">Preferred Track:</label><br>
            <select id="track" name="track">
              <option value="web-foundations">Web Foundations</option>
              <option value="programming-basics">Programming Basics</option>
              <option value="database-essentials">Database Essentials</option>
            </select>
          </p>

          <p>
            <label for="motivation">Why do you want to join?</label><br>
            <textarea id="motivation" name="motivation" rows="4" cols="40"></textarea>
          </p>
        </fieldset>

        <p>
          <button type="submit">Submit Application</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Addis Code Academy. All rights reserved.</p>
  </footer>
</body>
</html>
